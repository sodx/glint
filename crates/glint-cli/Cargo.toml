[package]
name = "glint-cli"
description = "The `glint` command: send values and pipe program output into Glint"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "glint"
path = "src/main.rs"

[dependencies]
glint-protocol.workspace = true
glint-core.workspace = true
glint-server.workspace = true
glint-store-sqlite.workspace = true
tokio = { workspace = true, features = ["process"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json.workspace = true
ulid.workspace = true
ureq = { version = "2", default-features = false, features = ["json"] }


[lints]
workspace = true
