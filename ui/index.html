<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glint</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===================== Glint tokens =====================
   Colour is OKLCH so equal roles share perceived lightness.
   Neutrals: "graphite", a cool slate (hue 265) at very low chroma.
   Brand: "spark" — the glint itself, an electric lime (hue 122).
   States share one lightness/chroma band per theme: fail 25°, wait 70°, ok 155°.
   Code: number = sky 235°, string = sand 75°, keyword = violet 300°.
   Type: Mona Sans (variable width) for UI, JetBrains Mono for data.
   ======================================================== */
:root {
  --bg: oklch(98.7% .003 265); --surface: oklch(100% 0 0); --hover: oklch(96.2% .005 265); --code: oklch(97.4% .004 265);
  --line: oklch(92% .006 265); --line-strong: oklch(86.5% .008 265);
  --text: oklch(21% .012 265); --muted: oklch(47% .014 265); --faint: oklch(61% .012 265);
  --red: oklch(54% .2 25); --red-soft: oklch(96% .028 25);
  --amber: oklch(56% .13 65); --amber-soft: oklch(96.5% .035 75);
  --green: oklch(52% .13 155); --green-soft: oklch(96.5% .035 155);
  --spark: oklch(91% .2 122); --accent: oklch(52% .15 128); --accent-soft: oklch(95% .07 122);
  --num: oklch(50% .15 245); --str: oklch(50% .11 60); --kw: oklch(50% .17 300);
  --shadow: 0 1px 2px oklch(20% .02 265 / .05), 0 10px 30px oklch(20% .02 265 / .10);
  --sans: "Mona Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: oklch(16.5% .009 265); --surface: oklch(20% .01 265); --hover: oklch(22.5% .011 265); --code: oklch(18.5% .01 265);
    --line: oklch(26.5% .011 265); --line-strong: oklch(32.5% .013 265);
    --text: oklch(95.5% .005 265); --muted: oklch(73% .013 265); --faint: oklch(57% .013 265);
    --red: oklch(69% .19 25); --red-soft: oklch(25% .055 25);
    --amber: oklch(81% .14 75); --amber-soft: oklch(26% .045 75);
    --green: oklch(77% .14 155); --green-soft: oklch(25% .04 155);
    --spark: oklch(90% .2 122); --accent: oklch(88% .19 122); --accent-soft: oklch(27% .06 122);
    --num: oklch(79% .11 235); --str: oklch(84% .09 80); --kw: oklch(77% .13 300);
    --shadow: 0 1px 2px oklch(0% 0 0 / .35), 0 14px 36px oklch(0% 0 0 / .5);
    color-scheme: dark;
  }
}
.brand { font-variation-settings: "wdth" 125; font-weight: 750; letter-spacing: -0.02em; }
.say .text b, .run-switch .title { font-variation-settings: "wdth" 112; }
.say .text { font-variation-settings: "wdth" 104; }
.live .mark { color: var(--spark) !important; filter: drop-shadow(0 0 3px color-mix(in oklch, var(--spark) 60%, transparent)); }
@media (prefers-color-scheme: light) { .live .mark { color: var(--accent) !important; filter: none; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--sans); font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; }
::selection { background: var(--accent-soft); color: var(--text); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.mono { font-family: var(--mono); font-size: 13px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

.wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
header { display: flex; align-items: center; gap: 12px; height: 56px; }
.crumb { color: var(--muted); }
.spacer { flex: 1; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
kbd { font: 11px var(--mono); color: var(--faint); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }

/* status: the answer */
.status { padding: 28px 0 24px; display: grid; gap: 14px; }
.say { display: flex; align-items: flex-start; gap: 12px; }
.say .glyph { margin-top: 4px; }
.say .text { flex: 1; min-width: 0; font-size: 18px; line-height: 1.45; letter-spacing: -0.01em; }
.say .text b { font-weight: 600; }
.say .sub { display: block; font-size: 14px; color: var(--muted); margin-top: 2px; letter-spacing: 0; }
.say .sub .mono { font-size: 13px; }
.say.fail .glyph { color: var(--red); } .say.fail b.verb { color: var(--red); }
.say.pause .glyph { color: var(--amber); } .say.pause b.verb { color: var(--amber); }
.say.ok .glyph { color: var(--green); }
.say.quiet .text { font-size: 14px; color: var(--muted); }
.say.quiet .glyph { margin-top: 2px; opacity: .8; }
.actions { display: flex; gap: 6px; align-items: center; flex: none; padding-top: 1px; }
.btn { height: 32px; padding: 0 14px; border-radius: 8px; font-size: 14px; font-weight: 500; border: 1px solid var(--line-strong); background: var(--surface); }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn.primary:hover { opacity: .88; }
.link { color: var(--muted); font-size: 14px; padding: 6px 8px; border-radius: 6px; }
.link:hover { color: var(--text); background: var(--hover); }

/* run */
.run-head { display: flex; align-items: center; gap: 10px; padding: 14px 0 8px; border-top: 1px solid var(--line); position: relative; }
.run-switch { display: flex; align-items: baseline; gap: 8px; padding: 4px 8px; margin-left: -8px; border-radius: 8px; }
.run-switch:hover { background: var(--hover); }
.run-switch .title { font-weight: 600; }
.run-switch .meta { color: var(--muted); font-size: 14px; }
.run-switch svg { align-self: center; color: var(--faint); }
.search { flex: 1; display: none; align-items: center; gap: 8px; height: 36px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); }
.search input { flex: 1; border: 0; outline: 0; background: none; font: inherit; color: var(--text); }
.search input::placeholder { color: var(--faint); }
.searching .search { display: flex; } .searching .run-switch { display: none; }

.menu { position: absolute; top: 48px; left: -8px; z-index: 5; width: min(420px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; display: none; }
.menu.open { display: block; }
.menu button { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; }
.menu button:hover, .menu button[aria-current="true"] { background: var(--hover); }
.menu .when { color: var(--faint); font-size: 13px; }
.menu .state { color: var(--muted); font-size: 13px; }

ol.entries { list-style: none; margin: 0 0 96px; padding: 0; }
.entry { border-radius: 10px; }
.entry + .entry { margin-top: 2px; }
.row { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 40px; padding: 8px 10px; border-radius: 10px; }
.row:hover { background: var(--hover); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); justify-self: center; }
.lv-warn .dot { background: var(--amber); } .lv-error .dot { background: var(--red); } .lv-pause .dot { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); } .lv-ok .dot { background: var(--green); }
.sum { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum .tag { color: var(--muted); margin-right: 6px; }
.lv-error .sum .tag { color: var(--red); font-weight: 500; } .lv-warn .sum .tag, .lv-pause .sum .tag { color: var(--amber); font-weight: 500; }
.sum .mono { font-size: 13.5px; }
.sum .soft { color: var(--muted); }
.right { color: var(--faint); font-size: 13px; white-space: nowrap; }
.right .loc { font-family: var(--mono); font-size: 12.5px; margin-right: 12px; opacity: 0; transition: opacity .15s; }
.row:hover .loc, .open .loc { opacity: 1; }
.open > .row { background: var(--hover); align-items: start; }
.open .sum { white-space: normal; overflow: visible; }
.open .sum .in-pane { display: none; }
.open .node { margin-top: 0; }
.new > .row { animation: arrive 2.4s cubic-bezier(.16,1,.3,1); }
@keyframes arrive { from { background: var(--accent-soft); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .new > .row { animation: none; outline: 1px solid var(--accent); } }

.detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s cubic-bezier(.16,1,.3,1); }
.open .detail { grid-template-rows: 1fr; }
.detail > div { overflow: hidden; }
.pane { padding: 6px 10px 18px 32px; display: grid; gap: 12px; }
.pane .msg { font-size: 15px; }
.code { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font: 13px/1.6 var(--mono); overflow-x: auto; white-space: pre; }
.kv { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 13px; }
.kv b { color: var(--text); font-weight: 500; }
.frames { list-style: none; margin: 0; padding: 0; font: 13px/1.5 var(--mono); }
.frames li { display: flex; gap: 12px; padding: 3px 0; }
.frames .fn { color: var(--text); min-width: 0; }
.frames .fn { flex-shrink: 0; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frames .fpath { margin-left: auto; }
.fpath, .origin-line .where { all: unset; display: inline-flex; min-width: 0; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; border-radius: 3px; white-space: nowrap; }
span.fpath, span.where { cursor: default; }
.origin-line .where { color: var(--faint); }
button.fpath:hover, .origin-line button.where:hover { color: var(--accent); }
button.fpath:focus-visible, .origin-line button.where:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pdir { overflow: hidden; text-overflow: ellipsis; min-width: 0; flex-shrink: 1; }
.pbase { flex-shrink: 0; }
.snippet.loading { display: none; }
.snippet .file .fpath { font-size: 12px; max-width: 80%; }
.frames .vendor { color: var(--faint); }
.note { display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; background: var(--accent-soft); font-size: 14px; }
.note svg { color: var(--accent); margin-top: 2px; }
.note .who { color: var(--muted); }
.pane-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.turn { display: grid; grid-template-columns: 72px 1fr; gap: 12px; font-size: 14px; }
.turn .role { color: var(--faint); font-size: 13px; }
table { border-collapse: collapse; font: 13px var(--mono); }
th, td { text-align: left; padding: 6px 18px 6px 0; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
.tree { font: 13px/1.65 var(--mono); }
.tree .k { color: var(--muted); } .tree .s { color: var(--str); } .tree .n { color: var(--num); } .tree .z { color: var(--faint); }
.tree .jl { padding-left: 18px; position: relative; }
.tree .j .in { display: block; }
.tree .jt { all: unset; cursor: pointer; color: var(--muted); border-radius: 3px; }
.tree .jt::before { content: ""; position: absolute; left: 5px; top: .68em; border: 4px solid transparent; border-top-color: var(--faint); border-bottom: 0; transition: transform .12s; }
.tree .j.shut > .jt::before { transform: rotate(-90deg); }
.tree .jt:hover, .tree .jt:hover::before { color: var(--text); border-top-color: var(--text); }
.tree .jt:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tree .fold { display: none; color: var(--faint); cursor: pointer; }
.tree .fold:hover { color: var(--muted); }
.tree .j.shut > .fold { display: inline; }
.tree .j.shut > .in, .tree .j.shut > .close { display: none; }
.tree .close { color: var(--muted); }
.tree > .j > .jt::before { display: none; }
.field { display: flex; gap: 6px; }
.field input { flex: 1; height: 32px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 0 10px; background: var(--surface); color: var(--text); font: 13px var(--mono); }
.empty { color: var(--muted); padding: 24px 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
ol.entries:has(.empty)::before { display: none; }

.demo { position: fixed; right: 16px; bottom: 16px; }
.demo > button { font-size: 12px; color: var(--faint); padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.demo .menu { top: auto; bottom: 40px; left: auto; right: 0; width: 220px; }
.demo .menu button { grid-template-columns: 1fr; }

/* brand, project, live */
.mark { width: 18px; height: 18px; flex: none; }
.mark path { fill: currentColor; }
.brand { display: flex; align-items: center; gap: 8px; }
.proj { display: flex; align-items: center; gap: 2px; color: var(--muted); padding: 4px 6px 4px 8px; border-radius: 8px; margin-left: 2px; }
.proj:hover { background: var(--hover); color: var(--text); }
.proj svg { color: var(--faint); width: 14px; height: 14px; }
.live { display: flex; align-items: center; gap: 6px; color: var(--faint); font-size: 13px; margin-right: 4px; }
.live .mark { width: 11px; height: 11px; color: var(--green); }
.glint { animation: glint 1s cubic-bezier(.16,1,.3,1); }
@keyframes glint {
  0% { transform: scale(1) rotate(0deg); filter: none; }
  30% { transform: scale(1.9) rotate(45deg); filter: drop-shadow(0 0 5px var(--green)); }
  100% { transform: scale(1) rotate(90deg); filter: none; }
}

/* ambient state: the top of the window carries the state's colour, faintly */
body { position: relative; }
body::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 320px; pointer-events: none;
  background: linear-gradient(to bottom, var(--wash, transparent), transparent); }
body[data-state="fail"] { --wash: color-mix(in srgb, var(--red) 10%, transparent); }
body[data-state="pause"] { --wash: color-mix(in srgb, var(--amber) 10%, transparent); }
body[data-state="calm"] { --wash: color-mix(in srgb, var(--green) 7%, transparent); }
.wrap { position: relative; }

/* timeline spine */
ol.entries { position: relative; }
ol.entries::before { content: ""; position: absolute; left: 20.5px; top: 20px; bottom: 20px; width: 1px; background: var(--line); }
.node { position: relative; z-index: 1; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; justify-self: center;
  background: var(--bg); border: 1px solid var(--line-strong); color: var(--faint); transition: background-color .12s; }
.node svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.row:hover .node, .open > .row .node { background: var(--surface); }
.lv-error .node { color: var(--red); background: var(--red-soft); border-color: color-mix(in oklch, var(--red) 45%, transparent); }
.lv-warn .node, .lv-pause .node { color: var(--amber); background: var(--amber-soft); border-color: color-mix(in oklch, var(--amber) 45%, transparent); }
.lv-ok .node { color: var(--green); background: var(--green-soft); border-color: color-mix(in oklch, var(--green) 45%, transparent); }
.lv-pause .node { box-shadow: 0 0 0 3px color-mix(in oklch, var(--amber) 22%, transparent); }
.new .node { color: var(--accent); border-color: var(--accent); }

/* source snippet in exceptions */
/* Code reads as typed: no ligatures turning === into ≡ or => into ⇒. */
.snippet, .code, .tree, .frames, .mono, .term { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
.snippet { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font: 13px/1.75 var(--mono); }
.snippet .file { display: flex; justify-content: space-between; gap: 12px; padding: 6px 12px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.snippet ol { margin: 0; padding: 6px 0; list-style: none; background: var(--code); overflow-x: auto; }
.snippet li { display: grid; grid-template-columns: 46px 1fr; white-space: pre; padding-right: 12px; }
.snippet li > span:first-child { color: var(--faint); text-align: right; padding-right: 16px; user-select: none; }
.snippet li.hit { background: var(--red-soft); }
.snippet li.hit > span:first-child { color: var(--red); }
.snippet .kw { color: var(--kw); } .snippet .err { text-decoration: underline wavy var(--red); text-underline-offset: 4px; }

/* keyboard hints */
.keys { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 14px; color: var(--faint); font-size: 12px; }
.keys kbd { margin-right: 4px; }
@media (max-width: 900px) { .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { .glint { animation: none; } .detail { transition: none; } }

/* project switcher, first run, offline */
.proj-wrap { position: relative; }
.run-switch .wt{font-family:var(--mono);font-size:.92em;color:var(--text)}
.run-head[hidden] { display: none; }
.onboard .code { position: relative; padding-right: 48px; }
.cc { position: absolute; right: 6px; top: 6px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--faint); }
.cc:hover { color: var(--text); background: var(--surface); box-shadow: 0 0 0 1px var(--line-strong); }
.cc svg { width: 15px; height: 15px; }
#projMenu { top: 40px; left: 0; width: 300px; }
.say.idle .glyph { color: var(--accent); width: 18px; height: 18px; margin-top: 3px; }
.onboard { display: grid; gap: 14px; padding: 4px 0 8px; }
.onboard .way { display: grid; gap: 6px; }
.onboard .lbl { font-size: 13px; color: var(--muted); }
.onboard .code { white-space: pre-wrap; }
.onboard .kw { color: var(--kw); } .onboard .str { color: var(--str); }
ol.entries:has(.onboard)::before { display: none; }
.live.offline { color: var(--amber); }
.live.offline .mark { color: var(--faint) !important; filter: none !important; animation: blink 1.6s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .live.offline .mark { animation: none; } }

/* terminal output (agent tool calls) */
.term { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font: 13px/1.7 var(--mono); }
.term-head { display: flex; justify-content: space-between; gap: 12px; padding: 7px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
.term-body { padding: 10px 12px; background: var(--code); white-space: pre; overflow-x: auto; color: var(--muted); }
.t-prompt { color: var(--accent); margin-right: 4px; }
.t-fail { color: var(--red); } .t-ok { color: var(--green); }
.exit { color: var(--red); font-size: 12px; white-space: nowrap; }

/* durations: a small waterfall, each bar placed where its work started in the run */
.dur { display: inline-flex; align-items: center; gap: 8px; margin-right: 14px; font-size: 12.5px; color: var(--muted); }
.dur i { display: block; width: 56px; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.dur i { width: 72px; }
.dur i::before { content: ""; display: block; height: 100%; width: var(--w); margin-left: min(var(--x, 0%), calc(100% - var(--w))); border-radius: 4px; background: var(--faint); }
/* The call tree */
.entry { position: relative; }
.entry.child { margin-left: calc(var(--depth) * 20px); }
.entry.child::before { content: ""; position: absolute; left: -9px; top: -2px; bottom: -2px; border-left: 1px solid var(--line); }
.twig { position: absolute; left: -20px; top: 11px; width: 18px; height: 18px; display: grid; place-items: center; border-radius: 5px; color: var(--faint); z-index: 2; }
.entry:not(.child) > .twig { left: -18px; }
.twig:hover { color: var(--text); background: var(--surface); }
.twig .i { width: 12px; height: 12px; transition: transform .12s; }
.twig[aria-expanded="false"] .i { transform: rotate(-90deg); }
.kids { font-size: 12px; color: var(--faint); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; }
.lv-warn .dur i::before { background: var(--amber); } .lv-warn .dur { color: var(--amber); }

/* quick actions on hover */
.entry { position: relative; }
.qa { position: absolute; right: 8px; top: 5px; display: flex; gap: 2px; opacity: 0; pointer-events: none; transition: opacity .12s; background: var(--hover); padding-left: 8px; }
.entry:hover > .qa, .qa:focus-within { opacity: 1; pointer-events: auto; }
.entry:hover > .row .when, .entry:hover > .row .loc { visibility: hidden; }
.qa button { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); }
.qa button:hover { background: var(--surface); color: var(--text); box-shadow: 0 0 0 1px var(--line-strong); }
.qa svg { width: 15px; height: 15px; }

/* buttons: press feel and shortcut hints */
.btn, .link, .qa button, .row { transition: transform .08s, background-color .12s, border-color .12s; }
.btn:active, .qa button:active { transform: scale(.97); }
.btn kbd { margin-left: 8px; border-color: currentColor; color: inherit; opacity: .55; }
@media (max-width: 560px) { .btn kbd { display: none; } }

/* command palette */

.palette { position: fixed; inset: 0; z-index: 20; display: none; align-items: flex-start; justify-content: center; padding-top: 16vh;
  background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(3px); }
.palette.open { display: flex; }
.palette .box { width: min(600px, calc(100vw - 24px)); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden;

@keyframes pop { from { transform: translateY(-6px) scale(.985); opacity: 0; } }
.palette input { width: 100%; height: 52px; border: 0; outline: 0; padding: 0 18px; font: 16px var(--sans); color: var(--text); background: none; border-bottom: 1px solid var(--line); }

.palette li .hint { margin-left: auto; color: var(--faint); font-size: 12px; }
.palette li svg { color: var(--muted); }
.palette .none { padding: 18px 12px; color: var(--muted); }

/* toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 12px); opacity: 0; pointer-events: none; z-index: 30;
  background: var(--text); color: var(--bg); font-size: 13.5px; padding: 9px 14px; border-radius: 10px; box-shadow: var(--shadow); transition: opacity .2s, transform .3s cubic-bezier(.16,1,.3,1); }

::view-transition-old(root), ::view-transition-new(root) { animation-duration: .18s; }
@media (prefers-reduced-motion: reduce) { .palette .box { animation: none; } ::view-transition-group(*) { animation: none !important; } }

@media (max-width: 560px) {

}

.has-note { font-size: 11px; color: var(--accent); border: 1px solid color-mix(in oklch, var(--accent) 45%, transparent); border-radius: 999px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; }
.origin-line { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; font-size: 11.5px; color: var(--faint); font-family: var(--mono); }
.origin-line > * + *::before { content: "·"; margin-right: 10px; color: var(--faint); opacity: .7; }

.entry[data-color="green"] .node { color: var(--green); border-color: color-mix(in oklch, var(--green) 45%, transparent); }

<script>
"use strict";
/* Glint UI — answer first. Live data from glintd: /v1/runs, /v1/events, /v1/stream, /v1/ctl.
   Product rules: PRODUCT.md (principle 0). Tokens: the comment block at the top of the CSS. */

const $ = id => document.getElementById(id);
const LEVELS = ["trace", "debug", "info", "warn", "error", "fatal"];
const MAX_ROWS = 500;
const store = {
  get(k, d) { try { const v = localStorage.getItem("glint." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("glint." + k, JSON.stringify(v)); } catch {} },
};

const S = {
  project: store.get("project", null), projects: [], allRuns: [], runs: [],
  run: null, entries: [], byId: new Map(), pendingUpd: new Map(),
  open: new Set(), q: "", showAll: false,
  fail: null, fails: [], seen: null, ack: new Set(store.get("ack", [])), pauses: [], answered: [],
  editor: store.get("editor", null), editors: [],
  offline: false, loaded: false,
};

/* ---------------- helpers ---------------- */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const rel = t => { const s = Math.max(1, Math.round((Date.now() - new Date(t)) / 1000)); return s < 60 ? s + " s ago" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };
const clock = t => new Date(t).toLocaleTimeString([], { hour12: false });
const icon = id => `<svg class="i glyph"><use href="#i-${id}"/></svg>`;
const base = p => String(p || "").split(/[\\/]/).pop();
const compact = v => v === undefined ? "" : typeof v === "string" ? v : JSON.stringify(v);
const clip = (s, n) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const levelOf = e => e.meta?.level ? LEVELS.indexOf(e.meta.level) : e.kind === "core.exception" ? 4 : 1;
const lvName = e => { const l = levelOf(e); return l >= 4 ? "error" : l === 3 ? "warn" : "info"; };
const loc = e => e.origin?.file ? base(e.origin.file) + (e.origin.line ? ":" + e.origin.line : "") : "";
/* Files open through glintd (POST /v1/open), which runs the editor's URL handler itself: that
   works the same in a browser and in the desktop app, whose web view ignores vscode:// links. */
const EDITORS = { vscode: "VS Code", cursor: "Cursor", windsurf: "Windsurf", zed: "Zed", phpstorm: "PhpStorm", webstorm: "WebStorm", pycharm: "PyCharm", idea: "IntelliJ IDEA", sublime: "Sublime Text" };
const isAbs = file => !!file && /^(\/|[A-Za-z]:)/.test(file);
function openBtn(e, frame, label, cls = "where") {
  return `<button class="${cls}" data-act="open" data-id="${esc(e.id)}"${frame != null ? ` data-frame="${frame}"` : ""} title="Open in ${esc(EDITORS[S.editor] || "editor")}">${label}</button>`;
}
async function openInEditor(id, frame) {
  const q = new URLSearchParams({ event: id }); if (frame != null && frame !== "") q.set("frame", frame); if (S.editor) q.set("editor", S.editor);
  try { const r = await api("/v1/open?" + q, { method: "POST" }); toast(`Opened in ${EDITORS[r.editor] || r.editor}`); }
  catch (err) { toast(`Could not open: ${err.message}`); }
}
/* A path as the project sees it: relative to the program's working directory when inside it,
   else the last folders. The directory part may be cut; file:line never is. */
function pathParts(file, line, e) {
  let p = String(file || ""); const cwd = e?.origin?.cwd;
  if (cwd && p.startsWith(cwd.replace(/[\\/]$/, "") + "/")) p = p.slice(cwd.replace(/[\\/]$/, "").length + 1);
  else { const parts = p.split(/[\\/]/).filter(Boolean); if (parts.length > 4) p = "…/" + parts.slice(-4).join("/"); }
  const i = p.search(/[^\\/]*$/);
  return `<span class="pdir">${esc(p.slice(0, i))}</span><span class="pbase">${esc(p.slice(i))}${line ? ":" + line : ""}</span>`;
}
async function api(path, opts) { const r = await fetch(path, opts); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText); return r.json(); }
function copy(text) { try { navigator.clipboard?.writeText(text).catch(() => {}); } catch {} }
let toastT;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1800); }
const motionOK = !matchMedia("(prefers-reduced-motion: reduce)").matches;
function vt(fn) { if (!document.startViewTransition || !motionOK || document.hidden) return fn(); const t = document.startViewTransition(fn); t.ready.catch(() => {}); t.finished.catch(() => {}); }
function glint() { const m = $("liveMark"); m.classList.remove("glint"); void m.getBoundingClientRect(); m.classList.add("glint"); }

/* A human name for a run id; runs carry no title of their own. */
function runTitle(id) {
  if (!id) return "";
  let m;
  // A run of a program is named by what it did first: its request line (`GET /checkout/8`), else
  // its script (`worker.py`), so runs of one language can be told apart.
  if (/^(js|python|php)-/.test(id)) {
    const r = S.allRuns.find(x => x.run === id);
    if (r?.head && /^[A-Z]+ \/\S*/.test(r.head)) return r.head.split(" ").slice(0, 2).join(" ");
    if (r?.file) return r.file.split(/[\\/]/).pop();
  }
  if ((m = id.match(/^claude-code:(.+)$/))) return "Agent session " + m[1].slice(0, 8);
  if ((m = id.match(/^otel-(.+)$/))) return "Trace " + m[1].slice(0, 8);
  if (/^pipe-/.test(id)) return "glint pipe";
  if (/^send-/.test(id)) return "glint send";
  if ((m = id.match(/^(js|python|php)-/))) return { js: "Node", python: "Python", php: "PHP" }[m[1]] + " process";
  if (id === "default") return "Default run";
  if (id === "mcp") return "Agent notes";
  return id;
}

/* ---------------- event model ---------------- */
const KIND_ICON = {
  "core.value": "value", "sql.query": "sql", "core.log": "log", "core.text": "log", "core.markdown": "log", "core.mermaid": "log",
  "core.html": "log", "core.json": "value", "core.exception": "exc", "core.trace": "exc", "llm.call": "llm",
  "agent.tool_call": "tool", "agent.tool_result": "tool", "agent.step": "prompt", "agent.session": "prompt", "agent.permission": "prompt",
  "ctl.pause": "pause", "core.measure": "measure", "core.span": "measure", "core.table": "table",
};
const ms = e => { const p = e.payload || {}; const v = p.duration_ms ?? p.latency_ms; return typeof v === "number" && v > 0 ? v : null; };
/* When something started, in ms. SDKs send a timed event when it ends (ts is the end);
   OpenTelemetry spans carry their start. */
const startOf = e => Date.parse(e.ts) - (/^otel-/.test(e.run) ? 0 : ms(e) || 0);

/* The call tree: an event whose parent is in this run sits under it (glint.measure() nests what
   its callback sends; OpenTelemetry spans nest by span id). Siblings in start order, so a
   measure comes before what happened inside it although it was sent last. */
S.collapsed = new Set();
function treeOrder(list) {
  const here = new Set(list.map(e => e.id)), kids = new Map(), roots = [];
  for (const e of list) {
    if (e.parent && e.parent !== e.id && here.has(e.parent)) (kids.get(e.parent) || kids.set(e.parent, []).get(e.parent)).push(e);
    else roots.push(e);
  }
  // Order is the order events were sent (glintd stores them so), except that a measure, sent when
  // it ends, takes the place of the first thing sent inside it. OpenTelemetry spans arrive in
  // batches, so they order by start time.
  const pos = new Map(list.map((e, i) => [e.id, i]));
  const key = new Map();
  const keyOf = e => {
    if (key.has(e.id)) return key.get(e.id);
    key.set(e.id, pos.get(e.id)); // guards against cycles
    const k = Math.min(pos.get(e.id), ...(kids.get(e.id) || []).map(keyOf));
    key.set(e.id, k);
    return k;
  };
  const by = (a, b) => (/^otel-/.test(a.run) ? startOf(a) - startOf(b) : 0) || keyOf(a) - keyOf(b);
  const out = [], seen = new Set();
  const walk = (e, d) => {
    if (seen.has(e.id)) return; seen.add(e.id);
    const ks = (kids.get(e.id) || []).sort(by);
    e.depth = d; e.kidCount = ks.length; out.push(e);
    if (!S.collapsed.has(e.id)) ks.forEach(k => walk(k, d + 1));
  };
  roots.sort(by).forEach(r => walk(r, 0));
  return out;
}

function foldAll(list) {
  S.entries = []; S.byId = new Map(); S.pendingUpd = new Map();
  list.forEach(e => fold(e, false));
}
function fold(e, live) {
  const p = e.payload || {};
  if (e.kind === "core.update") {
    const t = S.byId.get(p.target);
    if (t) applyUpdate(t, p); else S.pendingUpd.set(p.target, [...(S.pendingUpd.get(p.target) || []), p]);
    return;
  }
  if (e.kind === "ctl.resume") { const t = S.byId.get(p.target); if (t) t.resolved = p; return; }
  if (e.kind === "agent.tool_result" && e.parent && S.byId.has(e.parent)) { const c = S.byId.get(e.parent); c.result = e; return; }
  if (e.kind === "core.clear") { S.entries = []; return; }
  if (live) e.isNew = true;
  S.byId.set(e.id, e); S.entries.push(e);
  (S.pendingUpd.get(e.id) || []).forEach(u => applyUpdate(e, u)); S.pendingUpd.delete(e.id);
}
function applyUpdate(e, u) {
  e.meta = { ...(e.meta || {}), ...(u.meta || {}) };
  if (u.hidden != null) e.hiddenByUser = u.hidden;
  if (u.removed) e.removed = true;
}

/* What a row says, by kind: one line. */
function summary(e) {
  const p = e.payload || {}, k = e.kind;
  const tag = t => ({ tag: t });
  let lead = e.meta?.label || "", body = "", mono = false, t = null;
  switch (k) {
    case "core.value": body = compact(p.value !== undefined ? p.value : p); mono = true; if (!lead && p.type) lead = p.type; break;
    case "core.log": body = p.message ?? compact(p); break;
    case "core.text": case "core.markdown": case "core.mermaid": body = String(p.content ?? "").split("\n")[0]; break;
    case "core.html": body = String(p.content ?? "").replace(/<(script|style)[\s\S]*?<\/\1>/gi, " ").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim() || "HTML"; if (!lead) lead = "html"; break;
    case "core.json": body = compact(p.content ?? p); mono = true; break;
    case "core.exception": t = p.class || "Exception"; body = p.message || ""; break;
    case "core.trace": body = `${(p.frames || []).length} frames`; break;
    case "core.table": body = `${(p.rows || []).length} rows`; break;
    case "core.measure": body = p.name || "measure"; if (p.memory_bytes) body += ` · ${(p.memory_bytes / 1048576).toFixed(1)} MiB`; break;
    case "sql.query": body = p.sql || ""; mono = true; break;
    case "llm.call": {
      lead = p.model || lead || "llm";
      const user = [...(p.messages || [])].reverse().find(m => m.role === "user");
      const out = (p.output || [])[0];
      body = clip(msgText(user), 90) + (out ? " → “" + clip(msgText(out), 60) + "”" : "");
      if (p.error) t = "Error";
      break;
    }
    case "agent.tool_call": {
      lead = p.tool || lead; body = toolKey(p.args); mono = true;
      if (e.result && e.result.payload?.ok === false) t = "Failed";

  if (searching) list.forEach(e => { e.depth = 0; e.kidCount = 0; }); else list = treeOrder(list);
  // Timeline of the run, for the duration bars: each bar sits where its work started.
  const t0 = Math.min(...list.map(startOf)), t1 = Math.max(...list.map(e => startOf(e) + (ms(e) || 0)));
  const span = Math.max(1, t1 - t0);
  if (!list.length) { ol.innerHTML = S.q ? `<li class="empty">Nothing in ${esc(runTitle(S.run))} matches “${esc(S.q)}”. <button class="link" data-act="clearq">Clear search</button></li>` : `<li class="empty">This run has no events yet.</li>`; return; }
  ol.innerHTML = (hiddenCount && !S.showAll ? `<li class="empty"><button class="link" data-act="showall">Show ${hiddenCount} earlier events</button></li>` : "") + list.map(e => {
    const s = summary(e), lv = rowLevel(e), open = S.open.has(e.id), d = ms(e), l = loc(e);
    if (e.kind === "core.separator") return `<li class="entry sep" data-id="${esc(e.id)}"><hr></li>`;
    // An object or array is shown in full in the pane, so the open row keeps only its label.
    const structured = s.mono && /^[\[{]/.test(String(s.body || ""));
    const body = s.mono ? `<span class="mono${structured ? " in-pane" : ""}">${esc(s.body)}</span>` : esc(s.body);
    const twig = e.kidCount ? `<button class="twig" data-act="twig" data-id="${esc(e.id)}" aria-expanded="${!S.collapsed.has(e.id)}" aria-label="${S.collapsed.has(e.id) ? "Show" : "Hide"} ${e.kidCount} inside" title="${e.kidCount} inside"><svg class="i"><use href="#i-down"/></svg></button>` : "";
    return `<li class="entry lv-${lv}${open ? " open" : ""}${e.isNew ? " new" : ""}${e.hiddenByUser ? " muted" : ""}${e.depth ? " child" : ""}" style="--depth:${e.depth || 0}" data-id="${esc(e.id)}"${e.meta?.color ? ` data-color="${esc(e.meta.color)}"` : ""}>${twig}
      <button class="row" aria-expanded="${open}"><span class="node" aria-hidden="true"><svg><use href="#k-${KIND_ICON[e.kind] || "job"}"/></svg></span><span class="sum">${s.tag ? `<span class="tag">${esc(s.tag)}</span>` : ""}${s.lead ? `<span class="soft">${esc(s.lead)}</span> ` : ""}${body}${e.meta?.note ? ` <span class="has-note" title="Agent note">note</span>` : ""}${e.kidCount && S.collapsed.has(e.id) ? ` <span class="kids">+${e.kidCount}</span>` : ""}</span><span class="right">${d ? `<span class="dur" title="${d} ms, started +${Math.round(startOf(e) - t0)} ms into the run"><i style="--x:${((startOf(e) - t0) / span * 100).toFixed(1)}%;--w:${Math.max(3, d / span * 100).toFixed(1)}%"></i>${d < 1000 ? d + " ms" : (d / 1000).toFixed(2) + " s"}</span>` : ""}${l ? `<span class="loc">${esc(l)}</span>` : ""}<span class="when">${clock(e.ts)}</span></span></button>
      <div class="qa"><button data-qa="copy" aria-label="Copy as text" title="Copy"><svg class="i"><use href="#i-copy"/></svg></button>${isAbs(e.origin?.file) ? `<button data-act="open" data-id="${esc(e.id)}" aria-label="Open ${esc(l)} in editor" title="Open in ${esc(EDITORS[S.editor] || "editor")}"><svg class="i"><use href="#i-open"/></svg></button>` : ""}</div>
      <div class="detail"><div><div class="pane">${open ? pane(e) : ""}</div></div></div></li>`;
  }).join("");
  S.entries.forEach(e => (e.isNew = false));
  fillSources();
}
function onboarding() {
  const CC = `<button class="cc" data-cc aria-label="Copy command"><svg class="i"><use href="#i-copy"/></svg></button>`;
  $("status").innerHTML = `<div class="say idle"><svg class="mark glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.5l1.9 8.6 8.6 1.9-8.6 1.9L12 22.5l-1.9-8.6L1.5 12l8.6-1.9z"/></svg><div class="text"><b>Glint is running</b> — nothing has arrived yet<span class="sub">Events show up here the moment a program sends one. Pick whichever fits:</span></div></div>`;
  $("entries").innerHTML = `<li class="onboard">
    <div class="way"><span class="lbl">From any shell</span><div class="code">glint send '{"hello": "world"}'${CC}</div></div>
    <div class="way"><span class="lbl">Watch a dev server</span><div class="code">npm run dev 2>&1 | glint pipe${CC}</div></div>
    <div class="way"><span class="lbl">From your code</span><div class="code"><span class="kw">import</span> glint <span class="kw">from</span> <span class="str">"glint-sdk"</span>\nglint(order).label(<span class="str">"before save"</span>)${CC}</div></div>
    <div class="way"><span class="lbl">Existing Ray clients</span><div class="code">ray($order)  // spatie/ray sends to Glint on :23517${CC}</div></div>
    <div class="way"><span class="lbl">Let your agent read it</span><div class="code">claude mcp add --transport http glint ${esc(location.origin)}/mcp${CC}</div></div></li>`;
  document.body.dataset.state = "idle";
}

/* ---------------- render orchestration ---------------- */
let raf = 0;
function render() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; draw(); }); }
function draw() {
  projMenu();
  if (S.loaded && !S.runs.length) { $("runHead").hidden = true; onboarding(); chrome(); return; }
  status(); runHead(); entries(); chrome();
}
const FAV = { fail: "#e5484d", pause: "#e0a23c", calm: "#a8d63a", idle: "#8a8f9c" };
function chrome() {
  const st = document.body.dataset.state || "idle";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="${FAV[st]}" d="M12 1.5l1.9 8.6 8.6 1.9-8.6 1.9L12 22.5l-1.9-8.6L1.5 12l8.6-1.9z"/></svg>`;
  $("favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);
  const fail = S.fail && !S.ack.has(S.fail.id) ? S.fail : null;
  document.title = st === "fail" && fail ? `✗ ${runTitle(fail.run)} failed · Glint` : st === "pause" && S.pauses[0] ? `⏸ ${runTitle(S.pauses[0].run)} is waiting · Glint` : `Glint${S.project ? " · " + S.project : ""}`;
  $("live").classList.toggle("offline", S.offline);
  $("liveText").textContent = S.offline ? "Reconnecting…" : "Live";
  $("live").title = S.offline ? "Lost the connection to glintd; retrying" : "Connected to glintd";
}

/* ---------------- loading ---------------- */
async function loadRuns() {
  const { runs } = await api("/v1/runs?limit=300");
  S.allRuns = runs;
  S.projects = [...new Set(runs.map(r => r.project))];
  if (!S.projects.includes(S.project)) S.project = S.projects[0] || null;
  S.runs = runs.filter(r => r.project === S.project);
  if (!S.runs.some(r => r.run === S.run)) S.run = S.runs[0]?.run || null;
}
async function loadRun() {
  if (!S.run) { S.entries = []; return; }
  const { events } = await api(`/v1/events?run=${encodeURIComponent(S.run)}&limit=5000`);
  foldAll(events);
}
async function loadStatus() {
  const q = S.project ? `&project=${encodeURIComponent(S.project)}` : "";
  const [{ events }, { pauses }] = await Promise.all([api(`/v1/events?level=error&limit=50${q}`), api("/v1/ctl")]);
  S.fails = events.filter(e => e.kind !== "core.update" && e.kind !== "ctl.resume");
  pickFail();
  S.pauses = pauses.filter(p => !S.project || p.project === S.project);
}
/* The newest failure the user has not seen; if all are seen, the newest one (shown as "seen"). */
// The status line is about the newest failure only. Once you have seen it, it calms down; older
// failures stay in their runs instead of queueing up one after another.
function pickFail() {
  S.fail = S.fails[S.fails.length - 1] || null;
}
async function loadAll() {
  try { await loadRuns(); await Promise.all([loadRun(), loadStatus()]); S.loaded = true; S.offline = false; }
  catch (err) { S.offline = true; console.warn("glint: load failed", err); }
  render();
}

/* ---------------- live stream ---------------- */
let ws, retry = 500, runsTimer;
function connect() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/v1/stream");
  ws.onopen = () => { retry = 500; if (S.offline) { S.offline = false; loadAll(); } };
  ws.onmessage = m => {
    let e; try { e = JSON.parse(m.data); } catch { return; }
    if (e.glint === "lagged") { loadAll(); return; }
    onEvent(e);
  };
  ws.onclose = () => { S.offline = true; render(); setTimeout(connect, retry); retry = Math.min(retry * 2, 5000); };
}
function onEvent(e) {
  const inProject = e.project === S.project || !S.project;
  if (!S.project) { loadAll(); return; }
  if (inProject && e.run === S.run) fold(e, true);
  if (e.kind === "ctl.pause" || e.kind === "ctl.resume") api("/v1/ctl").then(r => { S.pauses = r.pauses.filter(p => p.project === S.project); render(); }).catch(() => {});
  if (inProject && levelOf(e) >= 4 && !["core.update", "ctl.resume"].includes(e.kind)) { S.fails.push(e); pickFail(); }
  clearTimeout(runsTimer);
  runsTimer = setTimeout(() => { const prev = S.run; loadRuns().then(() => prev !== S.run ? loadRun() : null).then(render).catch(() => {}); }, 250);
  if (inProject && e.kind !== "core.update") glint();
  render();
}

/* ---------------- actions ---------------- */
async function showFailure(which) {
  const f = which || S.fail; if (!f) return;
  S.ack.add(f.id); store.set("ack", [...S.ack].slice(-200)); S.seen = f;
  S.run = f.run; S.q = ""; document.body.classList.remove("searching");
  await loadRun();
  const holder = S.byId.has(f.id) ? f.id : (S.entries.find(x => x.result?.id === f.id) || {}).id || f.id;
  S.open.add(holder); pickFail(); draw();
  const li = document.querySelector(`[data-id="${CSS.escape(holder)}"]`);
  li?.scrollIntoView({ block: "center", behavior: motionOK ? "smooth" : "auto" }); li?.querySelector(".row").focus({ preventScroll: true });
}
async function answer(id, how) {
  const pz = S.pauses.find(p => p.id === id) || S.pauses[0]; if (!pz) return;
  const raw = document.querySelector(`[data-pval="${CSS.escape(pz.id)}"]`)?.value.trim();
  const body = { by: "ui" };
  if (how === "stop") body.stop = true; else if (raw) { try { body.value = JSON.parse(raw); } catch { body.value = raw; } }
  try {
    await api(`/v1/ctl/${encodeURIComponent(pz.id)}/resume`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
    S.answered.push(`${runTitle(pz.run)} ${how === "stop" ? "stopped" : "continued" + (body.value !== undefined ? " with " + JSON.stringify(body.value) : "")} by you.`);
    S.pauses = S.pauses.filter(p => p.id !== pz.id);
    toast(how === "stop" ? "Asked the program to stop" : "Program continued");
  } catch (err) { toast(String(err.message || err)); S.pauses = S.pauses.filter(p => p.id !== pz.id); }
  render();
}
function copyException(id) {
  const e = S.byId.get(id) || S.fail; if (!e) return;
  const p = e.payload || {};
  const frames = (p.frames || []).filter(f => !f.vendor).slice(0, 12).map(f => `  at ${f.fn || "{main}"} (${f.file}${f.line ? ":" + f.line : ""})`).join("\n");
  copy(`${p.class || "Error"}: ${p.message || ""}\n${frames}\nrun ${e.run} · project ${e.project} · glint event ${e.id}`);
  toast("Failure copied for your agent");
}
function goRun(id) { vt(async () => { S.run = id; S.q = ""; document.body.classList.remove("searching"); await loadRun(); draw(); }); }
function stepRun(d) { const o = S.runs.map(r => r.run), i = o.indexOf(S.run); if (o.length) goRun(o[(i + d + o.length) % o.length]); }
function goProject(p) { vt(async () => { S.project = p; store.set("project", p); S.run = null; await loadAll(); }); }
function openSearch() { document.body.classList.add("searching"); $("q").focus(); }
function closeSearch() { document.body.classList.remove("searching"); S.q = ""; $("q").value = ""; render(); }

document.addEventListener("click", ev => {
  const fold = ev.target.closest(".tree .fold"); // a folded node's preview unfolds it, like its brace
  if (fold) { fold.previousElementSibling.click(); return; }
  const b = ev.target.closest("button"); if (!b) return;
  const act = b.dataset.act;
  if (act === "show") return showFailure(b.dataset.again ? S.seen : null);
  if (act === "continue") return answer(b.dataset.id, "continue");
  if (act === "stop") return answer(b.dataset.id, "stop");
  if (act === "copyexc") return copyException(b.dataset.id);
  if (act === "open") { ev.stopPropagation(); return openInEditor(b.dataset.id, b.dataset.frame); }
  if (act === "twig") { const id = b.dataset.id; S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id); return render(); }
  if (act === "jtoggle") {
    const j = b.parentElement, shut = j.classList.toggle("shut");
    const all = ev.altKey ? [j, ...j.querySelectorAll(".j")] : [j];
    all.forEach(x => { x.classList.toggle("shut", shut); x.querySelector(":scope > .jt").setAttribute("aria-expanded", String(!shut)); });
    return;
  }
  if (act === "clearq") return closeSearch();
  if (act === "showall") { S.showAll = true; return render(); }
  if (b.hasAttribute("data-cc")) { const c = b.parentElement.cloneNode(true); c.querySelector(".cc").remove(); copy(c.textContent.trim()); return toast("Command copied"); }
  if (b.dataset.qa === "copy") { const e = S.byId.get(b.closest(".entry").dataset.id); const s = summary(e); copy([s.tag, s.lead, s.body].filter(Boolean).join(" ") + (loc(e) ? `  (${loc(e)})` : "")); return toast("Copied"); }
  if (b.classList.contains("row")) {
    const id = b.closest(".entry").dataset.id; if (!S.byId.has(id)) return;
    S.open.has(id) ? S.open.delete(id) : S.open.add(id); draw();
    document.querySelector(`[data-id="${CSS.escape(id)}"] .row`)?.focus(); return;
  }
  if (b.id === "runSwitch") { const m = $("runMenu"); m.classList.toggle("open"); b.setAttribute("aria-expanded", m.classList.contains("open")); return; }
  if (b.dataset.run) { $("runMenu").classList.remove("open"); return goRun(b.dataset.run); }
  if (b.id === "projBtn") { const m = $("projMenu"); m.classList.toggle("open"); b.setAttribute("aria-expanded", m.classList.contains("open")); return; }
  if (b.dataset.proj) { $("projMenu").classList.remove("open"); return goProject(b.dataset.proj); }
  if (b.id === "cmdkBtn") return openPalette();
});
document.addEventListener("click", ev => {
  if (!ev.target.closest(".run-head")) $("runMenu").classList.remove("open");
  if (!ev.target.closest(".proj-wrap")) $("projMenu").classList.remove("open");
}, true);
$("q").addEventListener("input", e => { S.q = e.target.value; render(); });

/* ---------------- command palette ---------------- */
let pSel = 0, pItems = [];
function commands() {
  const c = [];
  if (S.fail && !S.ack.has(S.fail.id)) c.push({ g: "Needs you", label: `Show the failure — ${runTitle(S.fail.run)}`, hint: "E", ico: "x", run: showFailure });
  S.pauses.forEach((p, i) => {
    c.push({ g: "Needs you", label: `Continue ${runTitle(p.run)}`, hint: i === 0 ? "C" : "", ico: "play", run: () => answer(p.id, "continue") });
    c.push({ g: "Needs you", label: `Stop ${runTitle(p.run)}`, ico: "pause", run: () => answer(p.id, "stop") });
  });
  S.runs.slice(0, 30).forEach(r => c.push({ g: "Runs", label: runTitle(r.run) + (runTitle(r.run) !== r.run ? ` (${r.run})` : ""), hint: rel(r.last), ico: "run", run: () => goRun(r.run) }));
  S.projects.filter(p => p !== S.project).forEach(p => c.push({ g: "Projects", label: `Switch to ${p}`, ico: "run", run: () => goProject(p) }));
  c.push({ g: "Actions", label: "Search this run", hint: "/", ico: "search", run: openSearch });
  if (S.fail) c.push({ g: "Actions", label: "Copy the last failure for your agent", ico: "copy", run: () => copyException(S.fail.id) });
  (S.editors.length ? S.editors : Object.keys(EDITORS)).forEach(id => c.push({ g: "Editor", label: `Open files in ${EDITORS[id] || id}${id === S.editor ? " ✓" : ""}`, ico: "run", run: () => { S.editor = id; store.set("editor", id); toast(`Files open in ${EDITORS[id] || id}`); } }));
  return c;
}
function drawPalette() {
  const q = $("pq").value.trim().toLowerCase();
  pItems = commands().filter(c => !q || q.split(/\s+/).every(w => c.label.toLowerCase().includes(w)));
  pSel = Math.min(pSel, Math.max(0, pItems.length - 1));
  let g = "", html = "";
  pItems.forEach((c, i) => {
    if (c.g !== g) { g = c.g; html += `<li class="grp" role="presentation">${esc(g)}</li>`; }
    html += `<li role="option" id="po${i}" data-i="${i}" aria-selected="${i === pSel}"><svg class="i"><use href="#i-${c.ico}"/></svg>${esc(c.label)}${c.hint ? `<span class="hint">${esc(c.hint)}</span>` : ""}</li>`;
  });
  $("plist").innerHTML = html || `<li class="none">No run or action matches.</li>`;
  $("pq").setAttribute("aria-activedescendant", "po" + pSel);
  $("po" + pSel)?.scrollIntoView({ block: "nearest" });
}
function openPalette() { $("palette").classList.add("open"); $("pq").value = ""; pSel = 0; drawPalette(); $("pq").focus(); }
function closePalette() { $("palette").classList.remove("open"); }
function runPalette(i) { const c = pItems[i]; if (!c) return; closePalette(); c.run(); }
$("pq").addEventListener("input", () => { pSel = 0; drawPalette(); });
$("pq").addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); pSel = Math.min(pItems.length - 1, pSel + 1); drawPalette(); }
  if (e.key === "ArrowUp") { e.preventDefault(); pSel = Math.max(0, pSel - 1); drawPalette(); }
  if (e.key === "Enter") { e.preventDefault(); runPalette(pSel); }
});
$("plist").addEventListener("click", e => { const li = e.target.closest("[data-i]"); li && runPalette(+li.dataset.i); });
$("palette").addEventListener("mousedown", e => { if (e.target.id === "palette") closePalette(); });

/* ---------------- keyboard ---------------- */
document.addEventListener("keydown", e => {
  const typing = ["INPUT", "TEXTAREA"].includes(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("palette").classList.contains("open") ? closePalette() : openPalette(); return; }
  if (e.key === "Escape" && $("palette").classList.contains("open")) { closePalette(); return; }
  if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey) {
    if (e.key === "e" && S.fail && !S.ack.has(S.fail.id)) return showFailure();
    if (e.key === "c" && S.pauses[0]) return answer(S.pauses[0].id, "continue");
    if (e.key === "[") return stepRun(-1);
    if (e.key === "]") return stepRun(1);
    if (e.key === "/") { e.preventDefault(); return openSearch(); }
    if (e.key === "j" || e.key === "k") {
      const rows = [...document.querySelectorAll(".entry .row")]; if (!rows.length) return;
      const i = rows.indexOf(document.activeElement);
      const next = rows[Math.max(0, Math.min(rows.length - 1, i < 0 ? (e.key === "j" ? 0 : rows.length - 1) : i + (e.key === "j" ? 1 : -1)))];
      next.focus(); next.scrollIntoView({ block: "nearest" });
    }
  }
  if (e.key === "Escape") { closeSearch(); $("runMenu").classList.remove("open"); $("projMenu").classList.remove("open"); }
});

setInterval(() => document.querySelectorAll(".ago").forEach(a => (a.textContent = rel(a.dataset.t))), 1000);
loadAll().then(connect);
// Which editors glintd found; the first is the default until you pick one (⌘K → "Open files in").
api("/v1/editors").then(r => { S.editors = r.editors || []; if (!S.editor) S.editor = S.editors[0] || "vscode"; }).catch(() => { S.editor ||= "vscode"; });
</script>
</body>
</html>
