[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"  # let-chains

[workspace.dependencies]
glint-protocol = { path = "crates/glint-protocol" }
glint-core = { path = "crates/glint-core" }
glint-store-sqlite = { path = "crates/glint-store-sqlite" }
glint-ingest = { path = "crates/glint-ingest" }
glint-server = { path = "crates/glint-server" }
glint-mcp = { path = "crates/glint-mcp" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
